name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests run with nothing but read access: whatever the test tools install can't touch the release.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: |
          python -m pip install --require-hashes -r hub/requirements.lock
          python -m pip install pytest
          python -m pytest -q
          node --test "tests/js/*.test.mjs"

  # The downloads are built from a fresh checkout by a job that installs nothing on the runner, then signed and
  # published. The setup program's build only downloads pinned files and checks each against its SHA-256 (python.org's
  # embeddable Python, NSIS, and CrossChat's packages from hub/requirements.lock via pip --require-hashes --target).
  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # publishes the release
      id-token: write        # signs the build provenance (Sigstore)
      attestations: write    # stores it on GitHub, for `gh attestation verify`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Build the zip
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Build the setup program
        shell: pwsh
        run: ./installer/build.ps1
      # Code signing, once SignPath Foundation approves the project. Needs secrets SIGNPATH_API_TOKEN and
      # SIGNPATH_ORGANIZATION_ID, and pinning both actions to a commit SHA. The signed EXE replaces the unsigned one,
      # so its .sha256 is written again after it.
      # - name: Upload the unsigned setup program for signing
      #   id: unsigned
      #   uses: actions/upload-artifact@<sha>  # v4
      #   with:
      #     name: unsigned-setup
      #     path: dist/CrossChat-Setup-*.exe
      # - name: Sign the setup program (SignPath)
      #   uses: signpath/github-action-submit-signing-request@<sha>  # v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: crosschat-obs
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist
      # - name: Checksum of the signed setup program
      #   shell: pwsh
      #   run: |
      #     $exe = Get-Item dist/CrossChat-Setup-*.exe
      #     Set-Content "$($exe.FullName).sha256" "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" -NoNewline -Encoding ascii
      - name: Prove where the downloads were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/CrossChat-*-windows.zip
            dist/CrossChat-Setup-*.exe
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $footer = "`n`n---`n**Code signing policy:** see the [README](https://github.com/RandyNorthrup/crosschat-obs#code-signing-policy). " +
            "Free code signing provided by SignPath.io, certificate by SignPath Foundation (application in progress). " +
            "Check a download with ``gh attestation verify <file> --repo RandyNorthrup/crosschat-obs``."
          Set-Content notes.md ($match.Groups[1].Value.Trim() + $footer)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "dist/CrossChat-Setup-$version.exe" "dist/CrossChat-Setup-$version.exe.sha256" `
            "dist/CrossChat-$version-windows.zip" "dist/CrossChat-$version-windows.zip.sha256" `
            --title "CrossChat $version" --notes-file notes.md --latest
