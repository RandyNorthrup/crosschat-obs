name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests run with nothing but read access: whatever the test tools install can't touch the release.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: |
          python -m pip install --require-hashes -r hub/requirements.lock
          python -m pip install pytest lupa
          python -m pytest -q
          node --test "tests/js/*.test.mjs"

  # The Mac download is tested on a Mac, read-only too.
  test-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: |
          python -m pip install --require-hashes -r hub/requirements.lock
          python -m pip install pytest
          brew install luajit
          python -m pytest -q
          node --test "tests/js/*.test.mjs"

  # The downloads are built from a fresh checkout by a job that installs nothing on the runner, then signed and
  # published. The setup program's build only downloads pinned files and checks each against its SHA-256 (python.org's
  # embeddable Python, NSIS, and CrossChat's packages from hub/requirements.lock via pip --require-hashes --target).
  release:
    needs: [test, test-mac]
    runs-on: windows-latest
    # Azure trusts GitHub's sign-in token only from this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write        # publishes the release
      id-token: write        # signs the build provenance (Sigstore) and signs in to Azure for code signing
      attestations: write    # stores it on GitHub, for `gh attestation verify`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Build the zips
        shell: pwsh
        run: |
          ./scripts/package.ps1
          python scripts/package_mac.py
      - name: Build the setup program
        shell: pwsh
        run: ./installer/build.ps1
      # Code signing with Azure Artifact Signing, under the maintainer's verified identity (CN=Randy Northrup). No
      # password is stored anywhere: Azure accepts GitHub's OIDC token for this repo's "release" environment only, and
      # that identity may do nothing but sign with this one certificate profile.
      - name: Sign in to Azure for code signing
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign the setup program
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: https://wus.codesigning.azure.net/
          signing-account-name: scnetsolutions
          certificate-profile-name: SAKUtility
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: CrossChat
          description-url: https://github.com/RandyNorthrup/crosschat-obs
          exclude-environment-credential: true
      - name: Check the signature, then write the checksum again
        shell: pwsh
        run: |
          $exe = Get-Item dist/CrossChat-Setup-*.exe
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "The setup program's signature is $($sig.Status): $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch 'CN=Randy Northrup') { throw "Signed by someone else: $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw "The signature has no timestamp" }
          Write-Host "Signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"
          Set-Content "$($exe.FullName).sha256" "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" -NoNewline -Encoding ascii
      - name: Prove where the downloads were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/CrossChat-*-windows.zip
            dist/CrossChat-Setup-*.exe
            dist/CrossChat-*-mac.zip
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $footer = "`n`n---`n**Code signing:** the Windows setup program is signed with Azure Artifact Signing (publisher: Randy Northrup). " +
            "Policy: see the [README](https://github.com/RandyNorthrup/crosschat-obs#code-signing-policy). " +
            "Check any download with ``gh attestation verify <file> --repo RandyNorthrup/crosschat-obs``."
          Set-Content notes.md ($match.Groups[1].Value.Trim() + $footer)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "dist/CrossChat-Setup-$version.exe" "dist/CrossChat-Setup-$version.exe.sha256" `
            "dist/CrossChat-$version-windows.zip" "dist/CrossChat-$version-windows.zip.sha256" `
            "dist/CrossChat-$version-mac.zip" "dist/CrossChat-$version-mac.zip.sha256" `
            --title "CrossChat $version" --notes-file notes.md --latest
