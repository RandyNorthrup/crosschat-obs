name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: |
          python -m pip install -r hub/requirements.txt pytest
          python -m pytest -q
          node --test "tests/js/*.test.mjs"
      - name: Build the download
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          Set-Content notes.md $match.Groups[1].Value.Trim()
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "dist/CrossChat-$version-windows.zip" "dist/CrossChat-$version-windows.zip.sha256" `
            --title "CrossChat $version" --notes-file notes.md --latest
