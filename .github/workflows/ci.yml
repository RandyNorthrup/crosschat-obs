name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Python packages
        run: |
          python -m pip install --require-hashes -r hub/requirements.lock
          python -m pip install pytest ruff
      - name: Lint (ruff)
        run: ruff check hub scripts tests
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: node --test "tests/js/*.test.mjs"
      - name: JavaScript syntax
        shell: bash
        run: for f in extension/*.js hub/web/*.js; do node --check "$f"; done
      - name: JSON files parse
        shell: bash
        run: for f in extension/manifest.json config.example.json hub/presets/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: Release package builds
        shell: pwsh
        run: ./scripts/package.ps1
